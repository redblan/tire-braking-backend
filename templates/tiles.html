<form action="/tiles" method="GET">
    <input type="number" step="0.01" name="grip" placeholder="Мин. коэффициент сцепления" value="{{ .grip }}">
    <button type="submit">Фильтр</button>
</form>
<div class="tiles-grid">
    {{ range .services }}
    <a href="/feed/{{ .ID }}" class="tile-card">
        <img src="{{ .ImageURL }}" class="image">
        <p>{{ .Name }}</p>
        <p>❤ {{ .Likes }}</p>
    </a>
    {{ end }}
</div>
<nav class="tabbar">
    <a href="/feed/1">Лента</a>
    <a href="/add">Добавление</a>
    <a href="/tiles">Плитка</a>
</nav>
