{{define "tiles.html"}}
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Тормозной путь — Плитка</title>
<link rel="stylesheet" href="/static/styles/main.css?v=3">
</head>
<body>
<div class="app">
  <div class="tiles-page">
    <form class="filter-form" action="/tiles" method="GET">
      <label class="filter-label">Мин. коэффициент сцепления: {{printf "%.2f" .grip}}</label>
      <input type="range" name="grip" min="0" max="1" step="0.05" value="{{.grip}}">
      <button type="submit">Применить фильтр</button>
    </form>
    <div class="tiles-grid">
      {{range .services}}
      <div class="tile-card">
        <a href="/feed/{{.ID}}" class="tile-card-link">
          <img src="{{.ImageURL}}" alt="{{.Name}}">
          <p>{{.Name}}</p>
          <span class="tile-likes">♥ {{.Likes}}</span>
        </a>
        <form action="/tiles/delete/{{.ID}}" method="POST">
          <button type="submit" class="delete-btn">Удалить</button>
        </form>
      </div>
      {{end}}
    </div>
  </div>
  <nav class="tabbar">
    <a href="/feed/1">Лента</a>
    <a href="/add">Добавление</a>
    <a href="/tiles" class="active">Плитка</a>
  </nav>
</div>
</body>
</html>
{{end}}
