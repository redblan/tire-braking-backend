<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Тормозной путь — Лента</title>
<link rel="stylesheet" href="/static/styles/main.css">
</head>
<body>
<div class="app">
  <div class="feed-media">
    <video src="{{ .service.VideoURL }}" autoplay muted loop playsinline></video>
    <div class="feed-overlay">
      <p class="feed-title">{{ .service.Name }}</p>
      <p class="feed-desc">{{ .service.Description }}</p>
      <div class="feed-tags">
        <span class="tag">{{ .service.TireType }}</span>
        <span class="tag">μ {{ .service.GripCoefficient }}</span>
      </div>
      <div class="feed-actions">
        <span>♥ {{ .service.Likes }}</span>
        <a href="/feed/{{ .service.ID }}?next=true" class="next">следующая →</a>
      </div>
    </div>
  </div>
  <nav class="tabbar">
    <a href="/feed/1" class="active">Лента</a>
    <a href="/add">Добавление</a>
    <a href="/tiles">Плитка</a>
  </nav>
</div>
</body>
</html>
