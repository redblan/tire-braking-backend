{{define "add.html"}}
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Тормозной путь — Добавление</title>
<link rel="stylesheet" href="/static/styles/main.css?v=7">
</head>
<body>
<div class="app">
  <div class="add-page">
    {{if .hasDraft}}
    <img class="add-preview" src="{{.service.ImageURL}}" alt="{{.service.Name}}" onerror="this.onerror=null;this.src='/static/images/default_tire.jpg'">
    <p class="model-file">3D модель: <a href="{{.service.ModelURL}}">файл .glb</a></p>
    <form action="/add/publish" method="POST">
      <input type="hidden" name="id" value="{{.service.ID}}">
      <input class="field" type="text" name="name" value="{{.service.Name}}" readonly>
      <input class="field" type="text" name="mu_tire" value="{{printf "%.2f" .service.MuTire}}" placeholder="Коэфф. сцепления шины">
      <input class="field" type="text" name="mu_surface" value="{{printf "%.2f" .service.MuSurface}}" placeholder="Коэфф. сцепления покрытия">
      <textarea class="field" name="description" placeholder="Описание">{{.service.Description}}</textarea>
      <button type="submit" class="submit-btn">Опубликовать</button>
    </form>
    {{else}}
    <form action="/add/create" method="POST" enctype="multipart/form-data">
      <img class="add-preview" src="/static/images/default_tire.jpg" alt="Изображение по умолчанию" onerror="this.onerror=null;this.src='/static/images/default_tire.jpg'">
      <label class="upload-field">
        <span class="upload-label">Фото</span>
        <input type="file" name="photo" accept="image/*">
      </label>
      <label class="upload-field">
        <span class="upload-label">3D модель (.glb)</span>
        <input type="file" name="model" accept=".glb,model/gltf-binary">
      </label>
      <input class="field" type="text" name="name" placeholder="Название сценария" required>
      <button type="submit" class="submit-btn">Далее</button>
    </form>
    {{end}}
  </div>
  <nav class="tabbar">
    <a href="/feed/1">Лента</a>
    <a href="/add" class="active">Добавление</a>
    <a href="/tiles">Плитка</a>
  </nav>
</div>
</body>
</html>
{{end}}
