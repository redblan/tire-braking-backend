basePath: /
definitions:
  handler.AnglesRequest:
    properties:
      angle_x:
        type: number
      angle_y:
        type: number
      token:
        type: string
    type: object
  handler.AuthResponse:
    properties:
      access_token:
        type: string
    type: object
  handler.CredentialsRequest:
    properties:
      password:
        type: string
      username:
        type: string
    type: object
  handler.LikeRequest:
    properties:
      value:
        type: integer
    type: object
  handler.PublishTireConditionRequest:
    properties:
      description:
        type: string
      description_en:
        type: string
      mu_surface:
        type: number
      mu_tire:
        type: number
    type: object
  repository.FeedResponse:
    properties:
      angle_x:
        type: number
      angle_y:
        type: number
      description:
        type: string
      description_en:
        type: string
      id:
        type: integer
      image_url:
        type: string
      is_liked:
        type: integer
      is_owner:
        type: integer
      model_url:
        type: string
      mu_surface:
        type: number
      mu_tire:
        type: number
      name:
        type: string
      position:
        type: integer
    type: object
  repository.TireConditionResponse:
    properties:
      angle_x:
        type: number
      angle_y:
        type: number
      description:
        type: string
      description_en:
        type: string
      id:
        type: integer
      image_url:
        type: string
      is_owner:
        type: integer
      model_url:
        type: string
      mu_surface:
        type: number
      mu_tire:
        type: number
      name:
        type: string
    type: object
  repository.TireConditionsPage:
    properties:
      data:
        items:
          $ref: '#/definitions/repository.TireConditionResponse'
        type: array
      limit:
        type: integer
      page:
        type: integer
      total:
        type: integer
    type: object
  repository.UserResponse:
    properties:
      id:
        type: integer
      username:
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  description: 'Расчёт тормозного пути: услуги (состояния шин и покрытия) и авторизация
    по JWT.'
  title: BrakePath API
  version: "1.0"
paths:
  /api/auth:
    post:
      consumes:
      - application/json
      parameters:
      - description: Логин и пароль
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.CredentialsRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.AuthResponse'
        "400":
          description: Некорректные параметры
        "401":
          description: Неверный логин или пароль
        "500":
          description: Внутренняя ошибка
      summary: Вход, выдача JWT
      tags:
      - auth
  /api/logout:
    post:
      responses:
        "204":
          description: Готово
        "401":
          description: Нет токена, токен невалиден, просрочен или отозван
        "500":
          description: Внутренняя ошибка
      security:
      - BearerAuth: []
      summary: 'Выход: токен попадает в blacklist до своего истечения'
      tags:
      - auth
  /api/register:
    post:
      consumes:
      - application/json
      description: is_moderator всегда false; пароль хранится как bcrypt-хеш
      parameters:
      - description: Логин и пароль
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.CredentialsRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/repository.UserResponse'
        "400":
          description: Некорректные параметры
        "409":
          description: Логин занят
        "500":
          description: Внутренняя ошибка
      summary: Регистрация
      tags:
      - auth
  /api/tire-conditions:
    get:
      description: 'Пагинация: page (с 1) и limit (по умолчанию 10, максимум 100).
        total — число услуг, подходящих под фильтр. is_owner: 0 или 1 — создатель
        услуги совпадает с текущим пользователем (для гостя 0)'
      parameters:
      - description: Минимальный коэффициент сцепления шины (mu_tire)
        in: query
        name: grip
        type: number
      - default: 1
        description: Номер страницы, с 1
        in: query
        name: page
        type: integer
      - default: 10
        description: Размер страницы, максимум 100
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/repository.TireConditionsPage'
        "400":
          description: Некорректные page или limit
        "401":
          description: Нет токена, токен невалиден, просрочен или отозван
        "500":
          description: Внутренняя ошибка
      summary: Список опубликованных услуг (страница)
      tags:
      - tire-conditions
    post:
      consumes:
      - multipart/form-data
      description: 'Шаг «Далее»: только название, изображение и 3D модель. Описание
        и коэффициенты сцепления задаются при публикации (PUT /api/tire-conditions/{id}/publish)'
      parameters:
      - description: Название
        in: formData
        name: name
        required: true
        type: string
      - description: Изображение
        in: formData
        name: image
        required: true
        type: file
      - description: 3D модель (.glb)
        in: formData
        name: model
        required: true
        type: file
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/repository.TireConditionResponse'
        "400":
          description: Некорректные параметры
        "401":
          description: Нет токена, токен невалиден, просрочен или отозван
        "500":
          description: Внутренняя ошибка
      security:
      - BearerAuth: []
      summary: Создать услугу (черновик) с загрузкой изображения и 3D модели в Minio
      tags:
      - tire-conditions
  /api/tire-conditions/{id}:
    delete:
      description: Своя услуга; модератор — любая
      parameters:
      - description: ID услуги
        in: path
        name: id
        required: true
        type: integer
      responses:
        "204":
          description: Удалено
        "400":
          description: Некорректные параметры
        "401":
          description: Нет токена, токен невалиден, просрочен или отозван
        "403":
          description: Нет прав / чужой объект
        "404":
          description: Не найдено
        "500":
          description: Внутренняя ошибка
      security:
      - BearerAuth: []
      summary: Удалить услугу (логически)
      tags:
      - tire-conditions
  /api/tire-conditions/{id}/angles:
    put:
      consumes:
      - application/json
      description: Вызывается асинхронным сервисом. Вместо JWT — постоянный ключ token
        в теле запроса. Углы в градусах, от 0 до 360.
      parameters:
      - description: ID услуги
        in: path
        name: id
        required: true
        type: integer
      - description: Ключ сервиса и новые углы
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.AnglesRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/repository.TireConditionResponse'
        "400":
          description: Некорректные параметры
        "403":
          description: Неверный ключ
        "404":
          description: Услуга не найдена
        "500":
          description: Внутренняя ошибка
      summary: Записать новые углы поворота 3D модели услуги (результат асинхронного
        сервиса)
      tags:
      - tire-conditions
  /api/tire-conditions/{id}/like:
    post:
      consumes:
      - application/json
      parameters:
      - description: ID услуги
        in: path
        name: id
        required: true
        type: integer
      - description: 'value: 1 — поставить, 0 — снять'
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.LikeRequest'
      responses:
        "204":
          description: Готово
        "400":
          description: Некорректные параметры
        "401":
          description: Нет токена, токен невалиден, просрочен или отозван
        "404":
          description: Не найдено
        "500":
          description: Внутренняя ошибка
      security:
      - BearerAuth: []
      summary: Поставить или снять лайк
      tags:
      - tire-conditions
  /api/tire-conditions/{id}/publish:
    put:
      consumes:
      - application/json
      description: Своя услуга; модератор — любая
      parameters:
      - description: ID услуги
        in: path
        name: id
        required: true
        type: integer
      - description: Описание, краткое описание на английском (50–100 символов) и
          коэффициенты (> 0)
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.PublishTireConditionRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/repository.TireConditionResponse'
        "400":
          description: Некорректные параметры
        "401":
          description: Нет токена, токен невалиден, просрочен или отозван
        "403":
          description: Нет прав / чужой объект
        "404":
          description: Не найдено
        "409":
          description: Недопустимый переход статуса
        "500":
          description: Внутренняя ошибка
      security:
      - BearerAuth: []
      summary: Опубликовать черновик услуги
      tags:
      - tire-conditions
  /api/tire-conditions/draft:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/repository.TireConditionResponse'
        "401":
          description: Нет токена, токен невалиден, просрочен или отозван
        "404":
          description: Черновика нет
        "500":
          description: Внутренняя ошибка
      security:
      - BearerAuth: []
      summary: Черновик услуги текущего пользователя
      tags:
      - tire-conditions
  /api/tire-conditions/feed:
    get:
      description: 'При next=true запускается асинхронный сервис: через 5–10 секунд
        он присылает новые углы поворота 3D модели этой услуги (angle_x, angle_y),
        их видно повторным запросом по id. Лента формируется в Redis при первом обращении
        сессии: 100 случайных неповторяющихся опубликованных услуг с порядковыми номерами
        (position); гость — по куке feed_session, авторизованный — по user_id. Без
        id — первая услуга ленты; ?id=N — услуга N; ?id=N&next=true — следующая в
        ленте после N; после 100-й формируются новые 100. is_liked: 0 или 1 — стоит
        ли лайк текущего пользователя на услуге (для гостя 0). position — порядковый
        номер услуги в ленте сессии (0, если услуги нет в ленте).'
      parameters:
      - description: ID услуги; без параметра — первая услуга ленты
        in: query
        name: id
        type: integer
      - description: true — вернуть следующую услугу ленты после id
        in: query
        name: next
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/repository.FeedResponse'
        "400":
          description: Некорректные параметры
        "401":
          description: Нет токена, токен невалиден, просрочен или отозван
        "404":
          description: Опубликованных услуг нет или услуга не найдена
        "500":
          description: Внутренняя ошибка
      summary: Одна услуга ленты
      tags:
      - tire-conditions
securityDefinitions:
  BearerAuth:
    description: Введите "Bearer <access_token>"
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
